# Môi trường chạy trên máy dev:  cd server && docker compose up -d --build
#   API tài khoản : http://localhost:8080
#   Web Admin     : http://localhost:8080/admin/
#   Game server   : docker compose --profile game up -d   (UDP 7777 + WebSocket 7778)
#   Hộp thư giả   : http://localhost:8025  (xem mã OTP quên mật khẩu)
#   PostgreSQL    : 127.0.0.1:5432  (user/db kiemhiep, mật khẩu = DB_PASSWORD trong .env)
# Mọi khóa/mật khẩu nằm trong server/.env (xem .env.example), không có trong file này.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kiemhiep
      POSTGRES_PASSWORD: ${DB_PASSWORD:?thiếu DB_PASSWORD trong .env}
      POSTGRES_DB: kiemhiep
    ports: ["127.0.0.1:5432:5432"]   # chỉ mở cho máy này, không mở ra mạng
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiemhiep"]
      interval: 2s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.20
    ports: ["127.0.0.1:8025:8025"]

  account:
    build:
      context: .
      dockerfile: account/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://kiemhiep:${DB_PASSWORD}@postgres:5432/kiemhiep?sslmode=disable
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      mailpit: { condition: service_started }

  # Game server: cần gói server/game/game_server.pck (bash server/build_game_server.sh).
  game:
    build: ./game
    environment:
      GAME_SERVICE_KEY: ${GAME_SERVICE_KEY:?thiếu GAME_SERVICE_KEY trong .env}
      GAME_ACCOUNT_URL: http://account:8080
      GAME_SERVER_ID: "1"
      GAME_DEV_TRUST_CLIENT: ${GAME_DEV_TRUST_CLIENT:-0}   # 1 = chỉ khi phát triển (xem .env.example)
    ports: ["7777:7777/udp", "7778:7778"]
    depends_on: [account]
    profiles: [game]      # chạy cùng: docker compose --profile game up -d

  # Chiến trường Tống Kim: cùng bản build game server, chạy map chiến trường ở cổng riêng (BattleServer).
  battle:
    build: ./game
    environment:
      GAME_SERVICE_KEY: ${GAME_SERVICE_KEY:?thiếu GAME_SERVICE_KEY trong .env}
      GAME_ACCOUNT_URL: http://account:8080
      GAME_SERVER_ID: "1"           # cùng máy chủ với server thế giới (nhân vật của máy chủ 1)
      GAME_BATTLE: "1"
      GAME_MAP_DIR: res://world/maps/map_378
      GAME_ENET_PORT: "7787"
      GAME_WS_PORT: "7788"
      GAME_PUBLIC_HOST: ${GAME_PUBLIC_HOST:-127.0.0.1}   # địa chỉ người chơi kết nối tới (báo qua /v1/battle)
      GAME_BATTLE_SIGNUP: ${GAME_BATTLE_SIGNUP:-600}     # giây báo danh (gốc 10 phút)
      GAME_BATTLE_FIGHT: ${GAME_BATTLE_FIGHT:-3600}      # giây khai chiến (gốc 60 phút)
      GAME_DEV_TRUST_CLIENT: ${GAME_DEV_TRUST_CLIENT:-0}
    ports: ["7787:7787/udp", "7788:7788"]
    depends_on: [account]
    profiles: [game]

  arena:
    build: ./game
    environment:
      GAME_SERVICE_KEY: ${GAME_SERVICE_KEY:?thiếu GAME_SERVICE_KEY trong .env}
      GAME_ACCOUNT_URL: http://account:8080
      GAME_SERVER_ID: "1"           # cùng máy chủ với server thế giới (nhân vật của máy chủ 1)
      GAME_ARENA: "1"               # đấu trường PK (popup PK: Đại hội võ lâm / Võ lâm Liên đấu)
      GAME_MAP_DIR: res://world/maps/map_397
      GAME_ENET_PORT: "7797"
      GAME_WS_PORT: "7798"
      GAME_PUBLIC_HOST: ${GAME_PUBLIC_HOST:-127.0.0.1}   # địa chỉ người chơi kết nối tới (báo qua /v1/arena)
      GAME_DEV_TRUST_CLIENT: ${GAME_DEV_TRUST_CLIENT:-0}
    ports: ["7797:7797/udp", "7798:7798"]
    depends_on: [account]
    profiles: [game]

volumes:
  pgdata:
