name: Build iOS App

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Kiểu build (debug hoặc release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/avatar/
            !/assets/monster/
            !/assets/skill_fx/
            !/assets/items/
            !/assets/monster_thumbs/
            !/audio/
            !/android/
            !/tools/
            !/docs/

      - name: Cấu hình phiên bản Xcode 16 (iOS 18 SDK)
        run: |
          echo "Danh sách Xcode có trên runner:"
          ls -d /Applications/Xcode* || true
          XCODE_16=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_16" ]; then
            echo "Kích hoạt $XCODE_16..."
            sudo xcode-select -s "$XCODE_16/Contents/Developer"
          fi
          xcodebuild -version

      - name: Cài đặt Godot ${{ env.GODOT_VERSION }}
        run: |
          echo "Tải Godot Engine..."
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot.app /Applications/Godot.app
          sudo ln -s /Applications/Godot.app/Contents/MacOS/Godot /usr/local/bin/godot
          godot --version

      - name: Cài đặt Export Templates
        run: |
          echo "Tải Export Templates..."
          curl -fsSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable/"
          ls -la "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Khởi tạo thư mục và Import assets
        run: |
          mkdir -p build/ios
          godot --headless --path . --import || true

      - name: Xuất dự án Xcode từ Godot
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          echo "Xuất Xcode project với kiểu: $BUILD_TYPE"
          if [ "$BUILD_TYPE" = "release" ]; then
            godot --headless --path . --export-release "iOS" build/ios/KiemHiep.xcodeproj
          else
            godot --headless --path . --export-debug "iOS" build/ios/KiemHiep.xcodeproj
          fi
          ls -la build/ios/

      - name: Vá lỗi liên kết các symbol Core Animation / Metal còn thiếu
        run: |
          echo "Tìm và bổ sung định nghĩa các symbol iOS 18..."
          for f in $(find build/ios -name "dummy.cpp"); do
            echo "Bổ sung definitions vào $f..."
            cat << 'EOF' >> "$f"
          #ifdef __cplusplus
          extern "C" {
          #endif
          __attribute__((weak)) void* CADynamicRangeAutomatic = 0;
          __attribute__((weak)) void* CADynamicRangeConstrainedHigh = 0;
          __attribute__((weak)) void* CADynamicRangeHigh = 0;
          __attribute__((weak)) void* CADynamicRangeStandard = 0;
          __attribute__((weak)) void* MTLTensorDomain = 0;
          #ifdef __cplusplus
          }
          #endif
          EOF
            echo "--- $f sau khi cập nhật ---"
            tail -n 16 "$f"
          done

      - name: Biên dịch Xcode Project (xcodebuild)
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            CONFIG="Release"
          else
            CONFIG="Debug"
          fi
          echo "Biên dịch cấu hình: $CONFIG"

          xcodebuild -project build/ios/KiemHiep.xcodeproj \
            -scheme KiemHiep \
            -configuration "$CONFIG" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Đóng gói file .ipa
        run: |
          rm -rf Payload kiem-hiep-ios.ipa
          mkdir -p Payload

          # Tìm thư mục .app trong DerivedData
          APP_PATH=$(find build/DerivedData -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "::error::Không tìm thấy file .app nào sau khi build!"
            exit 1
          fi

          echo "Tìm thấy App tại: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r -q kiem-hiep-ios.ipa Payload
          ls -lh kiem-hiep-ios.ipa

      - name: Tải file .ipa lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kiem-hiep-ios
          path: kiem-hiep-ios.ipa
          retention-days: 14
