server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Thiết lập MIME types chuẩn cho Godot WebAssembly
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        application/octet-stream pck;
    }

    # BẮT BUỘC: Headers bảo mật đa luồng cho Godot 4 Web (SharedArrayBuffer)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Headers an ninh trình duyệt
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Nén Gzip tăng tốc tải tài nguyên Web (WASM, JS, JSON)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/wasm
        image/svg+xml;

    # Không cache index.html để người chơi luôn nhận phiên bản game mới nhất
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Cache dài hạn tài nguyên tĩnh (wasm, pck, ảnh, âm thanh)
    location ~* \.(?:wasm|pck|png|jpg|jpeg|gif|ico|svg|mp3|ogg|wav)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Proxy API gọi server tài khoản (tránh CORS trình duyệt)
    location /v1/ {
        proxy_pass https://kiem-hiep-api.viettheo.site/v1/;
        proxy_set_header Host kiem-hiep-api.viettheo.site;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Điều hướng SPA / Game entrypoint
    location / {
        try_files $uri $uri/ /index.html;
    }
}
